# Bolsa_Insights - execucao diaria no GitHub Actions
# Agendado para segunda a sexta, 8h23 (Brasilia) = 11h23 UTC.
# Minuto "quebrado" de proposito: no minuto 0 de cada hora a fila do GitHub
# fica congestionada e a execucao pode atrasar horas (ou ser descartada).
# Tambem pode ser disparado manualmente na aba Actions (botao "Run workflow").

name: Bolsa Insights diario

on:
  workflow_dispatch: 
jobs:
  rodar:
    runs-on: ubuntu-24.04
    env:
      TZ: America/Sao_Paulo
      WHATSAPP_DESTINATARIOS: ${{ secrets.WHATSAPP_DESTINATARIOS }}

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Rodar o fluxo completo
        run: python rodar_tudo.py

      - name: Guardar relatorio e insights do dia
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-${{ github.run_number }}
          path: |
            relatorio_bolsa.xlsx
            insights.txt
          retention-days: 14
